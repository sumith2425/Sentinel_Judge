
services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_pass
      POSTGRES_DB: sentinel_judge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_judge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    container_name: sentinel-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DSN: "postgres://sentinel:sentinel_pass@postgres:5432/sentinel_judge?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    restart: always
    environment:
      POSTGRES_DSN: "postgres://sentinel:sentinel_pass@postgres:5432/sentinel_judge?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      PROBLEMS_DIR: "/problems"
      WORK_DIR: "/tmp/sentinel-work"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./testdata/problems:/problems:ro
      - /tmp/sentinel-work:/tmp/sentinel-work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sweeper:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.sweeper
    container_name: sentinel-sweeper
    restart: always
    environment:
      POSTGRES_DSN: "postgres://sentinel:sentinel_pass@postgres:5432/sentinel_judge?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: